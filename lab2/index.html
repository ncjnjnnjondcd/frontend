<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2 - Варіант 6</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f8fafc;
            color: #1e293b;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        hr {
            margin: 40px 0;
            border: none;
            border-top: 2px dashed #cbd5e1;
        }

        task-section {
            max-width: 900px;
            margin: 0 auto;
        }

        
        table {
            width: 707px;
            max-width: 100%;
            height: 178px;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 15px;
            background-color: #ffffff;
        }

        td {
            width: 20%;
            height: 44px;
            border: 2px solid #333333;
            text-align: center;
            vertical-align: middle;
            padding: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        
        tr.row1 {
            background-color: #068f8f;
            color: #ffffff;
        }

        
        tr.row1 td:hover {
            background-color: #ffffff;
            color: #068f8f;
        }

        
        tr.row2 {
            background-color: #f5f506;
            color: #111111;
        }

        
        tr.row2 td:hover {
            background-color: #111111;
            color: #f5f506;
        }
    </style>

    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <table>
            
        <tr class="row1">
            <td rowspan="2"></td>
            <td colspan="2">Мартинюк</td>
            <td>Максим</td>
            <td>Івановч</td>
        </tr>

        <tr class="row2">
            <td rowspan="2">ІО-44</td>
            <td rowspan="2">Лабораторна №2</td>
            <td rowspan="3">Варіант: 6</td>
            <td></td>
        </tr>

        <tr>
            <td></td>
            <td rowspan="2"></td>
        </tr>

            
        <tr>
            <td colspan="3"></td>
        </tr>
        </table>
        
        <figure class="phone-card">
            <figcaption>За допомогою position</figcaption>
            <article class="phone-pos">
                <time class="screen-pos" datetime="12:00">12:00</time>
            
                <form class="keypad-pos">
                    <button type="button" class="btn-pos b1"></button>
                    <button type="button" class="btn-pos b2"></button>
                    <button type="button" class="btn-pos b3"></button>
                    <button type="button" class="btn-pos b4"></button>
                    <button type="button" class="btn-pos b5"></button>
                    <button type="button" class="btn-pos b6"></button>
                    <button type="button" class="btn-pos b7"></button>
                    <button type="button" class="btn-pos b8"></button>
                    <button type="button" class="btn-pos b9"></button>
                </form>
            </article>
        </figure>
        

        <figure class="phone-card">
            <figcaption>За допомогою transform</figcaption>
            <article class="phone-trans">
                <time class="screen-trans" datetime="12:00">12:00</time>
                <form class="keypad-trans">
                    <button type="button" class="btn-trans t2"></button>
                    <button type="button" class="btn-trans t1"></button>
                    <button type="button" class="btn-trans t3"></button>
                    <button type="button" class="btn-trans t4"></button>
                    <button type="button" class="btn-trans t5"></button>
                    <button type="button" class="btn-trans t6"></button>
                    <button type="button" class="btn-trans t7"></button>
                    <button type="button" class="btn-trans t8"></button>
                    <button type="button" class="btn-trans t9"></button>
                </form>
            </article>
            </figure> 
  

</body>
</html>
